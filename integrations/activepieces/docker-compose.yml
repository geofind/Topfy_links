version: "3.8"

# Activepieces self-hosted (Workflow Engine) — ver ADR 0002 e
# docs/architecture/workflow-engine-decision.md na raiz do repo.
#
# Este Postgres é interno ao Activepieces (flows, execuções do próprio
# motor) — NÃO é o Supabase do CanalTopfy. Dados de negócio do produto
# continuam exclusivamente no Supabase (schema `canaltopfy`).

services:
  app:
    image: ghcr.io/activepieces/activepieces:0.86.2
    container_name: activepieces-app
    restart: unless-stopped
    env_file: .env
    environment:
      AP_CONTAINER_TYPE: APP
    ports:
      - "8080:80"
    depends_on:
      - postgres
      - redis
    volumes:
      - ap_cache:/usr/src/app/cache
    networks:
      - activepieces

  worker:
    image: ghcr.io/activepieces/activepieces:0.86.2
    restart: unless-stopped
    env_file: .env
    environment:
      AP_CONTAINER_TYPE: WORKER
    depends_on:
      - app
    volumes:
      - ap_cache:/usr/src/app/cache
    networks:
      - activepieces
    deploy:
      replicas: 1 # aumentar conforme volume de execuções na Fase 1+

  postgres:
    image: pgvector/pgvector:0.8.0-pg14
    container_name: activepieces-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AP_POSTGRES_DATABASE}
      POSTGRES_USER: ${AP_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
    volumes:
      - ap_postgres_data:/var/lib/postgresql/data
    networks:
      - activepieces

  redis:
    image: redis:7.0.7
    container_name: activepieces-redis
    restart: unless-stopped
    volumes:
      - ap_redis_data:/data
    networks:
      - activepieces

volumes:
  ap_postgres_data:
  ap_redis_data:
  ap_cache:

networks:
  activepieces:
    driver: bridge
